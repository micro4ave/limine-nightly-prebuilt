
name: Build Limine

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: limine-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            llvm \
            nasm \
            mtools \
            autoconf \
            automake \
            patch \
            git \
            zip

      - name: Clone Limine source
        run: |
          git clone \
            --depth=1 \
            --branch=trunk \
            https://github.com/Limine-Bootloader/Limine.git \
            limine-src

      - name: Build Limine
        run: |
          cd limine-src
          ./bootstrap
          ./configure \
            --enable-bios \
            --enable-uefi-x86-64 \
            --enable-uefi-ia32
          make -j"$(nproc)"

      - name: Prepare binaries
        run: |
          mkdir -p dist
          cp -a limine-src/bin/. dist/

          git -C limine-src rev-parse HEAD > dist/SOURCE_COMMIT

          test -f dist/limine
          test -f dist/limine-bios.sys
          test -f dist/BOOTX64.EFI

          ls -lah dist/

      - name: Create ZIP archive
        run: |
          cd dist
          zip -r ../limine-binaries.zip .

      - name: Publish binaries branch
        run: |
          cd dist

          git init
          git checkout -b binaries

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Build Limine $(cat SOURCE_COMMIT)"

          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push origin binaries --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: limine-${{ github.sha }}
          name: Limine build ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: false
          files: limine-binaries.zip
