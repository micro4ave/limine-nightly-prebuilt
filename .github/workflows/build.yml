
name: Build Limine

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent simultaneous builds from overwriting each other.
concurrency:
  group: limine-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            mtools \
            autoconf \
            automake \
            patch \
            git

      - name: Clone Limine source
        run: |
          git clone \
            --depth=1 \
            --branch=v12.x \
            https://github.com/Limine-Bootloader/Limine.git \
            limine-src

      - name: Build Limine
        run: |
          cd limine-src

          ./bootstrap

          ./configure \
            --enable-bios \
            --enable-uefi-x86-64 \
            --enable-uefi-ia32

          make -j"$(nproc)"

      - name: Prepare binaries
        run: |
          mkdir -p dist

          cp -a limine-src/bin/. dist/

          # Record exactly which Limine commit was built.
          git -C limine-src rev-parse HEAD > dist/SOURCE_COMMIT

          # Fail instead of publishing an incomplete build.
          test -f dist/limine
          test -f dist/limine-bios.sys
          test -f dist/BOOTX64.EFI

          echo "Built files:"
          ls -lah dist/

      - name: Publish binaries branch
        run: |
          cd dist

          git init
          git checkout -b binaries

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Build Limine $(cat SOURCE_COMMIT)"

          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push origin binaries --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
